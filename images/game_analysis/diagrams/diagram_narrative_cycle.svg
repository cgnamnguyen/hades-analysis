<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%" style="background:#0e1017; font-family:'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrNarrative" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="920" height="360" rx="16" fill="#13141f" stroke="#b45309" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="35" y="45" fill="#fbbf24" font-size="16" font-weight="800" letter-spacing="1">VÒNG LẶP CỐT TRUYỆN: CÁI CHẾT LÀ NHỊP CẦU TƯỜNG THUẬT</text>
  <text x="35" y="68" fill="#9ca3af" font-size="12">Narrative.lua &bull; Hệ thống đối thoại động phản hồi chính xác nguyên nhân cái chết</text>

  <!-- 4 Step Flow -->
  <!-- Step 1 -->
  <g transform="translate(35, 100)">
    <rect x="0" y="0" width="190" height="130" rx="12" fill="#1a1c29" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="18" y="32" fill="#93c5fd" font-size="14" font-weight="800">1 &bull; VƯỢT ẢI (RUN)</text>
    <text x="18" y="58" fill="#e2e8f0" font-size="12" font-weight="700">Khởi hành Underworld</text>
    <text x="18" y="80" fill="#9ca3af" font-size="11">Vượt 4 tầng Tartarus &rarr;</text>
    <text x="18" y="98" fill="#9ca3af" font-size="11">Asphodel &rarr; Elysium &rarr; Styx</text>
  </g>

  <line x1="230" y1="165" x2="255" y2="165" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrNarrative)"/>

  <!-- Step 2 -->
  <g transform="translate(265, 100)">
    <rect x="0" y="0" width="190" height="130" rx="12" fill="#241318" stroke="#ef4444" stroke-width="1.5"/>
    <text x="18" y="32" fill="#f87171" font-size="14" font-weight="800">2 &bull; TỬ TRẬN (DEATH)</text>
    <text x="18" y="58" fill="#fca5a5" font-size="12" font-weight="700">Chết Trong Chiến Trận</text>
    <text x="18" y="80" fill="#9ca3af" font-size="11">Hoặc đánh bại Hades</text>
    <text x="18" y="98" fill="#9ca3af" font-size="11">&rarr; Chìm vào dòng sông Styx</text>
  </g>

  <line x1="460" y1="165" x2="485" y2="165" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrNarrative)"/>

  <!-- Step 3 -->
  <g transform="translate(495, 100)">
    <rect x="0" y="0" width="190" height="130" rx="12" fill="#221528" stroke="#a855f7" stroke-width="1.5"/>
    <text x="18" y="32" fill="#c084fc" font-size="14" font-weight="800">3 &bull; TÁI SINH HỒ MÁU</text>
    <text x="18" y="58" fill="#e9d5ff" font-size="12" font-weight="700">House of Hades</text>
    <text x="18" y="80" fill="#9ca3af" font-size="11">Kích hoạt hội thoại mới:</text>
    <text x="18" y="98" fill="#9ca3af" font-size="11">Achilles, Nyx, Hypnos, Hades</text>
  </g>

  <line x1="690" y1="165" x2="715" y2="165" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrNarrative)"/>

  <!-- Step 4 -->
  <g transform="translate(725, 100)">
    <rect x="0" y="0" width="180" height="130" rx="12" fill="#131e19" stroke="#10b981" stroke-width="1.5"/>
    <text x="18" y="32" fill="#34d399" font-size="14" font-weight="800">4 &bull; TÁI ĐỊNH VỊ</text>
    <text x="18" y="58" fill="#a7f3d0" font-size="12" font-weight="700">Nâng Cấp Chỉ Số</text>
    <text x="18" y="80" fill="#9ca3af" font-size="11">Dùng Darkness mở Gương,</text>
    <text x="18" y="98" fill="#9ca3af" font-size="11">Đổi Keepsake &bull; Bắt đầu Run mới</text>
  </g>

  <!-- Cycle Loop Arrow -->
  <path d="M 815,240 C 815,310 130,310 130,240" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrNarrative)"/>
  <text x="470" y="305" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle">CHU TRÌNH TÁI SINH VÔ TẬN: MỖI LẦN CHẾT LÀ MỘT BƯỚC TIẾN CỐT TRUYỆN</text>
</svg>