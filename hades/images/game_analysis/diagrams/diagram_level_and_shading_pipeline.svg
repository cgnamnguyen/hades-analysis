<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%" style="background:#0c0d14; font-family:'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141624"/>
      <stop offset="100%" stop-color="#0a0b12"/>
    </linearGradient>
    <marker id="arrPipeGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="940" height="500" rx="16" fill="url(#pipeGrad)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="35" y="45" fill="#60a5fa" font-size="16" font-weight="900" letter-spacing="1">KIẾN TRÚC ĐỒ HỌA 2.5D ISOMETRIC, SHADING &amp; PIPELINE TẠO LEVEL (THE FORGE ENGINE)</text>
  <text x="35" y="68" fill="#9ca3af" font-size="12">Mô hình Hybrid 3D-to-2D • 30 Lớp ThingGroups • Normal-Mapped Shading • Procedural Assembly</text>

  <!-- 4 Main Pillars -->
  <!-- Col 1: Character 3D-to-2D -->
  <g transform="translate(35, 95)">
    <rect x="0" y="0" width="210" height="340" rx="12" fill="#151726" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="15" y="30" fill="#fbbf24" font-size="13" font-weight="800">1. NHÂN VẬT &amp; QUÁI VẬT</text>
    <text x="15" y="50" fill="#fde68a" font-size="11">Pipeline Hybrid 3D → 2D</text>

    <rect x="12" y="65" width="186" height="60" rx="6" fill="#1b1d2e"/>
    <text x="20" y="85" fill="#e2e8f0" font-size="11" font-weight="700">• 3D Rigged Meshes:</text>
    <text x="20" y="102" fill="#9ca3af" font-size="10.5">Dựng hình Maya/Blender,</text>
    <text x="20" y="116" fill="#9ca3af" font-size="10.5">diễn hoạt khung xương 3D.</text>

    <rect x="12" y="135" width="186" height="70" rx="6" fill="#1b1d2e"/>
    <text x="20" y="155" fill="#e2e8f0" font-size="11" font-weight="700">• 32-Dir Pre-render:</text>
    <text x="20" y="172" fill="#9ca3af" font-size="10.5">Xuất Sprite Sheets ở 32</text>
    <text x="20" y="186" fill="#9ca3af" font-size="10.5">góc xoay Isometric mượt mà.</text>
    <text x="20" y="200" fill="#9ca3af" font-size="10.5">Tiết kiệm 80% tải tính toán.</text>

    <rect x="12" y="215" width="186" height="70" rx="6" fill="#1b1d2e"/>
    <text x="20" y="235" fill="#e2e8f0" font-size="11" font-weight="700">• Normal &amp; Depth Maps:</text>
    <text x="20" y="252" fill="#9ca3af" font-size="10.5">Mỗi khung 2D có kèm ảnh</text>
    <text x="20" y="266" fill="#9ca3af" font-size="10.5">pháp tuyến để chiếu sáng động</text>
    <text x="20" y="280" fill="#9ca3af" font-size="10.5">như mô hình 3D thật sự!</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="255" y1="265" x2="270" y2="265" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrPipeGold)"/>

  <!-- Col 2: Environment Layers -->
  <g transform="translate(280, 95)">
    <rect x="0" y="0" width="210" height="340" rx="12" fill="#151726" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="15" y="30" fill="#60a5fa" font-size="13" font-weight="800">2. BẢN ĐỒ &amp; MÔI TRƯỜNG</text>
    <text x="15" y="50" fill="#bfdbfe" font-size="11">Phân Tầng ThingGroups</text>

    <rect x="12" y="65" width="186" height="50" rx="6" fill="#121e2a"/>
    <text x="20" y="85" fill="#38bdf8" font-size="11" font-weight="700">Lớp 1: Terrain_Below</text>
    <text x="20" y="102" fill="#9ca3af" font-size="10.5">Vực thẳm sâu, dung nham xa.</text>

    <rect x="12" y="122" width="186" height="50" rx="6" fill="#121e2a"/>
    <text x="20" y="142" fill="#38bdf8" font-size="11" font-weight="700">Lớp 2: Terrain_base</text>
    <text x="20" y="159" fill="#9ca3af" font-size="10.5">Mặt sàn đá, lối đi nhân vật.</text>

    <rect x="12" y="179" width="186" height="50" rx="6" fill="#121e2a"/>
    <text x="20" y="199" fill="#38bdf8" font-size="11" font-weight="700">Lớp 3: Terrain_Decor</text>
    <text x="20" y="216" fill="#9ca3af" font-size="10.5">Cột đá, bình gốm, bẫy gai.</text>

    <rect x="12" y="236" width="186" height="50" rx="6" fill="#121e2a"/>
    <text x="20" y="256" fill="#38bdf8" font-size="11" font-weight="700">Lớp 4: Terrain_Overlay</text>
    <text x="20" y="273" fill="#9ca3af" font-size="10.5">Mây bóng tối che phủ đỉnh đầu.</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="500" y1="265" x2="515" y2="265" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrPipeGold)"/>

  <!-- Col 3: Shading &amp; Lighting -->
  <g transform="translate(525, 95)">
    <rect x="0" y="0" width="210" height="340" rx="12" fill="#151726" stroke="#a855f7" stroke-width="1.5"/>
    <text x="15" y="30" fill="#c084fc" font-size="13" font-weight="800">3. SHADING &amp; ÁNH SÁNG</text>
    <text x="15" y="50" fill="#e9d5ff" font-size="11">132 Shader HLSL / Vulkan</text>

    <rect x="12" y="65" width="186" height="60" rx="6" fill="#1e142e"/>
    <text x="20" y="85" fill="#d8b4fe" font-size="11" font-weight="700">• Lighting3D.frag:</text>
    <text x="20" y="102" fill="#9ca3af" font-size="10.5">Point light + Normal Map</text>
    <text x="20" y="116" fill="#9ca3af" font-size="10.5">tạo Rim Light &amp; Đổ bóng 3D.</text>

    <rect x="12" y="135" width="186" height="60" rx="6" fill="#1e142e"/>
    <text x="20" y="155" fill="#d8b4fe" font-size="11" font-weight="700">• Comic Inking (SDF):</text>
    <text x="20" y="172" fill="#9ca3af" font-size="10.5">Viền mực đen truyện tranh</text>
    <text x="20" y="186" fill="#9ca3af" font-size="10.5">sắc nét không răng cưa.</text>

    <rect x="12" y="205" width="186" height="60" rx="6" fill="#1e142e"/>
    <text x="20" y="225" fill="#d8b4fe" font-size="11" font-weight="700">• Post-Processing:</text>
    <text x="20" y="242" fill="#9ca3af" font-size="10.5">Bloom bừng sáng, Color LUT</text>
    <text x="20" y="256" fill="#9ca3af" font-size="10.5">đặc trưng 4 Biome âm phủ.</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="745" y1="265" x2="760" y2="265" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrPipeGold)"/>

  <!-- Col 4: Level Generation -->
  <g transform="translate(770, 95)">
    <rect x="0" y="0" width="160" height="340" rx="12" fill="#151726" stroke="#10b981" stroke-width="1.5"/>
    <text x="15" y="30" fill="#34d399" font-size="13" font-weight="800">4. TẠO LEVEL</text>
    <text x="15" y="50" fill="#a7f3d0" font-size="11">Procedural Assembly</text>

    <rect x="10" y="65" width="140" height="50" rx="6" fill="#132018"/>
    <text x="16" y="85" fill="#6ee7b7" font-size="11" font-weight="700">145 Bản Đồ Gốc</text>
    <text x="16" y="102" fill="#9ca3af" font-size="10">Vẽ tay thủ công.</text>

    <rect x="10" y="122" width="140" height="50" rx="6" fill="#132018"/>
    <text x="16" y="142" fill="#6ee7b7" font-size="11" font-weight="700">Tệp SGB1 Nhị Phân</text>
    <text x="16" y="159" fill="#9ca3af" font-size="10">Nén LZ4 siêu tốc.</text>

    <rect x="10" y="179" width="140" height="60" rx="6" fill="#132018"/>
    <text x="16" y="199" fill="#6ee7b7" font-size="11" font-weight="700">RoomManager.lua</text>
    <text x="16" y="215" fill="#9ca3af" font-size="10">Chọn phòng theo Depth,</text>
    <text x="16" y="228" fill="#9ca3af" font-size="10">lọc 8 phòng NeverRepeat.</text>

    <rect x="10" y="246" width="140" height="60" rx="6" fill="#132018"/>
    <text x="16" y="266" fill="#6ee7b7" font-size="11" font-weight="700">Encounter Trộn Quái</text>
    <text x="16" y="282" fill="#9ca3af" font-size="10">Ngẫu nhiên hóa bầy địch,</text>
    <text x="16" y="295" fill="#9ca3af" font-size="10">bẫy và phần thưởng.</text>
  </g>

  <!-- Bottom Summary Footer -->
  <rect x="35" y="450" width="895" height="42" rx="8" fill="#161826" stroke="#4b5563" stroke-width="1"/>
  <text x="50" y="475" fill="#fde68a" font-size="12" font-weight="700">KẾT LUẬN KIẾN TRÚC: Hades là đỉnh cao của giải pháp mỹ thuật kết hợp kỹ thuật (Artistic-Engine Synergy).</text>
  <text x="735" y="475" fill="#93c5fd" font-size="11" font-family="Consolas, monospace">The Forge Engine • C++ &amp; Lua</text>
</svg>