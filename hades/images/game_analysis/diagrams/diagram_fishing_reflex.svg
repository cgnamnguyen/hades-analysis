<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="100%" height="100%" style="background:#0e1017; font-family:'Segoe UI', Roboto, sans-serif;">
  <rect x="10" y="10" width="920" height="320" rx="16" fill="#11131c" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="35" y="45" fill="#60a5fa" font-size="16" font-weight="800" letter-spacing="1">CỬA SỔ PHẢN XẠ CÂU CÁ (FISHING TIMING WINDOWS)</text>
  <text x="35" y="68" fill="#9ca3af" font-size="12">FishingData.lua • Đo lường tính từ khoảnh khắc phao chìm thật sự kèm âm thanh 'Ding!'</text>

  <!-- Timeline Bar -->
  <rect x="35" y="100" width="870" height="28" rx="6" fill="#1b1c2b"/>
  <!-- Perfect zone (0 - 340ms) -->
  <rect x="35" y="100" width="295" height="28" rx="6" fill="#10b981"/>
  <!-- Good zone (340 - 680ms) -->
  <rect x="330" y="100" width="295" height="28" fill="#3b82f6"/>
  <!-- Late zone (> 680ms) -->
  <rect x="625" y="100" width="280" height="28" rx="6" fill="#ef4444"/>

  <!-- Ticks -->
  <text x="35" y="90" fill="#9ca3af" font-size="11" font-weight="700">0 ms (Real Bite)</text>
  <text x="330" y="90" fill="#9ca3af" font-size="11" font-weight="700">340 ms</text>
  <text x="625" y="90" fill="#9ca3af" font-size="11" font-weight="700">680 ms</text>
  <text x="870" y="90" fill="#9ca3af" font-size="11" font-weight="700">1000 ms+</text>

  <!-- Zone Description Cards -->
  <g transform="translate(35, 145)">
    <rect x="0" y="0" width="280" height="140" rx="10" fill="#132018" stroke="#10b981" stroke-width="1.5"/>
    <text x="18" y="30" fill="#34d399" font-size="14" font-weight="800">0 → 340 MS • PERFECT CATCH</text>
    <text x="18" y="55" fill="#a7f3d0" font-size="12" font-weight="700">Bắt Hoàn Hảo</text>
    <text x="18" y="80" fill="#9ca3af" font-size="11.5">• 50% Cá Hiếm (Rare Fish)</text>
    <text x="18" y="102" fill="#9ca3af" font-size="11.5">• 50% Cá Huyền Thoại (Legendary Fish)</text>
    <text x="18" y="124" fill="#a7f3d0" font-size="11.5">Phần thưởng: Titan Blood &amp; Ambrosia</text>
  </g>

  <g transform="translate(330, 145)">
    <rect x="0" y="0" width="280" height="140" rx="10" fill="#131c26" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="18" y="30" fill="#60a5fa" font-size="14" font-weight="800">340 → 680 MS • GOOD CATCH</text>
    <text x="18" y="55" fill="#93c5fd" font-size="12" font-weight="700">Bắt Thành Công</text>
    <text x="18" y="80" fill="#9ca3af" font-size="11.5">• 100% Cá Thường (Common Fish)</text>
    <text x="18" y="102" fill="#9ca3af" font-size="11.5">• Đổi lấy Gemstones hoặc Darkness</text>
    <text x="18" y="124" fill="#bfdbfe" font-size="11.5">Dành cho phản xạ mức độ trung bình</text>
  </g>

  <g transform="translate(625, 145)">
    <rect x="0" y="0" width="280" height="140" rx="10" fill="#201317" stroke="#ef4444" stroke-width="1.5"/>
    <text x="18" y="30" fill="#f87171" font-size="14" font-weight="800">&gt; 680 MS • TOO LATE!</text>
    <text x="18" y="55" fill="#fca5a5" font-size="12" font-weight="700">Cá Trốn Thoát (Failed)</text>
    <text x="18" y="80" fill="#9ca3af" font-size="11.5">• Mất hoàn toàn lượt câu</text>
    <text x="18" y="102" fill="#9ca3af" font-size="11.5">• Điểm câu biến mất trong phòng</text>
    <text x="18" y="124" fill="#fecdd3" font-size="11.5">Cần chú ý tiếng 'Ding!' để giật cần sớm</text>
  </g>
</svg>