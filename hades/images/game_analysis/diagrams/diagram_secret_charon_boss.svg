<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0b0c12; font-family:'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="charonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161226"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="940" height="460" rx="16" fill="url(#charonGrad)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="35" y="45" fill="#c084fc" font-size="16" font-weight="900" letter-spacing="1">ĐẤU TRƯỜNG NGẦM: TRẬN ĐẤU TRÙM BÍ MẬT CHARON (SECRET BOSS FIGHT)</text>
  <text x="35" y="68" fill="#9ca3af" font-size="12">EnemyData.lua • Map: CharonFight01 • 16,500 HP • Thử thách cực hạn đầu game</text>

  <!-- 3 Stages Grid -->
  <!-- Phase 1 -->
  <g transform="translate(35, 95)">
    <rect x="0" y="0" width="280" height="235" rx="12" fill="#161528" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="20" y="32" fill="#93c5fd" font-size="13.5" font-weight="800">PHASE 1: 100% → 66% MÁU</text>
    <text x="20" y="52" fill="#bfdbfe" font-size="11">(16,500 HP → 10,890 HP)</text>
    
    <text x="20" y="85" fill="#f1f5f9" font-size="12" font-weight="700">• Quét Mái Chèo (Melee Combo):</text>
    <text x="35" y="105" fill="#9ca3af" font-size="11">Gây 40-55 sát thương 1 nhát (2 hit là chết!).</text>
    
    <text x="20" y="135" fill="#f1f5f9" font-size="12" font-weight="700">• CharonRadialPush:</text>
    <text x="35" y="155" fill="#9ca3af" font-size="11">Sóng đẩy 360 độ hất tung người chơi.</text>
    
    <text x="20" y="185" fill="#f1f5f9" font-size="12" font-weight="700">• Ghost Charge Trái / Phải:</text>
    <text x="35" y="205" fill="#9ca3af" font-size="11">Bức tường linh hồn quét ngang đấu trường.</text>
  </g>

  <!-- Phase 2 -->
  <g transform="translate(340, 95)">
    <rect x="0" y="0" width="280" height="235" rx="12" fill="#1e142e" stroke="#a855f7" stroke-width="1.5"/>
    <text x="20" y="32" fill="#c084fc" font-size="13.5" font-weight="800">PHASE 2: 66% → 33% MÁU</text>
    <text x="20" y="52" fill="#e9d5ff" font-size="11">(10,890 HP → 5,445 HP)</text>
    
    <text x="20" y="85" fill="#f1f5f9" font-size="12" font-weight="700">• RandomizeCover (Cột Đá):</text>
    <text x="35" y="105" fill="#9ca3af" font-size="11">Các cột đá che chắn đổi vị trí ngẫu nhiên.</text>
    
    <text x="20" y="135" fill="#f1f5f9" font-size="12" font-weight="700">• Ghost Charge Kép (Top &amp; Bot):</text>
    <text x="35" y="155" fill="#9ca3af" font-size="11">Linh hồn lao đồng thời từ trên và dưới.</text>
    
    <text x="20" y="185" fill="#f1f5f9" font-size="12" font-weight="700">• CharonTaunt:</text>
    <text x="35" y="205" fill="#9ca3af" font-size="11">Charon gầm rú, tăng tốc độ vung mái chèo.</text>
  </g>

  <!-- Phase 3 -->
  <g transform="translate(645, 95)">
    <rect x="0" y="0" width="280" height="235" rx="12" fill="#261224" stroke="#f43f5e" stroke-width="2"/>
    <text x="20" y="32" fill="#f87171" font-size="13.5" font-weight="900">PHASE 3: DƯỚI 33% MÁU</text>
    <text x="20" y="52" fill="#fca5a5" font-size="11">(Dưới 5,445 HP • TỬ CHIẾN)</text>
    
    <text x="20" y="85" fill="#fecdd3" font-size="12" font-weight="700">• Ghost Charge 360 Độ:</text>
    <text x="35" y="105" fill="#fca5a5" font-size="11">Linh hồn bay kín 4 hướng không góc chết!</text>
    
    <text x="20" y="135" fill="#fecdd3" font-size="12" font-weight="700">• Cần 15f i-Frames Hoàn Hảo:</text>
    <text x="35" y="155" fill="#fca5a5" font-size="11">Phải Lướt xuyên qua khe hở giữa 2 bóng ma.</text>
    
    <text x="20" y="185" fill="#fecdd3" font-size="12" font-weight="700">• Tấn Công Áp Đảo Tốc Độ:</text>
    <text x="35" y="205" fill="#fca5a5" font-size="11">Vừa quét cận chiến vừa đẩy lùi liên tục.</text>
  </g>

  <!-- Reward Banner -->
  <rect x="35" y="350" width="890" height="100" rx="12" fill="#161828" stroke="#eab308" stroke-width="1.5"/>
  <text x="55" y="378" fill="#fbbf24" font-size="14" font-weight="800">🏆 PHẦN THƯỞNG CHIẾN THẮNG: THẺ KHÁCH HÀNG VIP (LOYALTY CARD)</text>
  <text x="55" y="404" fill="#e2e8f0" font-size="12">1. Nhận lại toàn bộ <strong style="color:#fbbf24;">300 Đồng Xu Vàng</strong> đã 'mượn' từ túi của Charon.</text>
  <text x="55" y="426" fill="#34d399" font-size="12">2. Nhận Tín vật vĩnh viễn trong Run: <strong style="color:#34d399;">CharonStoreDiscount</strong> • GIẢM GIÁ 20% CHO MỌI VẬT PHẨM tại mọi Cửa Hàng và Giếng Charon!</text>
</svg>