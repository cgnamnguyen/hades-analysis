<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="100%" height="100%" style="background:#0d0e15; font-family:'Segoe UI', Roboto, sans-serif;">
  <rect x="10" y="10" width="920" height="340" rx="16" fill="#11131c" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="35" y="45" fill="#fbbf24" font-size="16" font-weight="800" letter-spacing="1">XÁC SUẤT XUẤT HIỆN TÚI THỨC ĂN SATYR SACK TẠI TẦNG STYX</text>
  <text x="35" y="68" fill="#9ca3af" font-size="12">Thuật toán ngẫu nhiên giả định (Pseudo-RNG) trong RunManager.lua</text>

  <!-- 4 Columns -->
  <!-- Col 1: 0% -->
  <g transform="translate(35, 95)">
    <rect x="0" y="0" width="200" height="175" rx="12" fill="#1b1517" stroke="#ef4444" stroke-width="1.5"/>
    <text x="25" y="35" fill="#f87171" font-size="15" font-weight="800">NHÁNH 1</text>
    <text x="25" y="85" fill="#ef4444" font-size="42" font-weight="900">0%</text>
    <text x="25" y="125" fill="#fca5a5" font-size="12" font-weight="700">Tuyệt đối không ra</text>
    <text x="25" y="148" fill="#9ca3af" font-size="11">Cửa đầu luôn chỉ để farm tài nguyên.</text>
  </g>

  <!-- Col 2: 54.5% -->
  <g transform="translate(260, 95)">
    <rect x="0" y="0" width="200" height="175" rx="12" fill="#131c26" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="25" y="35" fill="#60a5fa" font-size="15" font-weight="800">NHÁNH 2</text>
    <text x="25" y="85" fill="#38bdf8" font-size="42" font-weight="900">~54.5%</text>
    <text x="25" y="125" fill="#93c5fd" font-size="12" font-weight="700">Tỉ lệ xuất hiện cao</text>
    <text x="25" y="148" fill="#9ca3af" font-size="11">Hơn một nửa số lần chạy kết thúc tại đây.</text>
  </g>

  <!-- Col 3: 75% -->
  <g transform="translate(485, 95)">
    <rect x="0" y="0" width="200" height="175" rx="12" fill="#1f1b13" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="25" y="35" fill="#fbbf24" font-size="15" font-weight="800">NHÁNH 3</text>
    <text x="25" y="85" fill="#f59e0b" font-size="42" font-weight="900">~75%</text>
    <text x="25" y="125" fill="#fde68a" font-size="12" font-weight="700">Xác suất tích lũy</text>
    <text x="25" y="148" fill="#9ca3af" font-size="11">Nếu nhánh 2 hụt, nhánh 3 hầu như sẽ ra.</text>
  </g>

  <!-- Col 4: 100% -->
  <g transform="translate(710, 95)">
    <rect x="0" y="0" width="195" height="175" rx="12" fill="#132018" stroke="#10b981" stroke-width="2"/>
    <text x="25" y="35" fill="#34d399" font-size="15" font-weight="800">NHÁNH 4</text>
    <text x="25" y="85" fill="#10b981" font-size="42" font-weight="900">100%</text>
    <text x="25" y="125" fill="#a7f3d0" font-size="12" font-weight="700">Bảo hiểm tuyệt đối</text>
    <text x="25" y="148" fill="#9ca3af" font-size="11">Chắc chắn tìm thấy, không bao giờ tới nhánh 5.</text>
  </g>

  <text x="40" y="305" fill="#9ca3af" font-size="11.5">
    * Cơ chế đảm bảo người chơi không bao giờ bị 'Bad RNG' bắt đi đủ cả 5 nhánh nếu không chủ ý muốn vét đồ trước trận chung kết Hades.
  </text>
</svg>