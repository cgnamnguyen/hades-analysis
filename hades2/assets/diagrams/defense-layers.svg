<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
 <title id="title">Các lớp phòng thủ trong Hades II và mức xác minh</title><desc id="desc">Né là di chuyển, guard và riposte gắn vũ khí/aspect, armor tạm trừ trước armor bền theo Early Access Patch 10; chi tiết chưa xác minh.</desc>
 <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2a36b"/></marker><style>.bg{fill:#171820}.box{fill:#242631;stroke:#806c4b;stroke-width:2}.gold{fill:#352d20;stroke:#c2a36b;stroke-width:2}.red{fill:#3b252a;stroke:#cd7a6a;stroke-width:2}.h{font:700 23px system-ui,sans-serif;fill:#f4e7c7}.t{font:17px system-ui,sans-serif;fill:#ddd5c5}.s{font:15px system-ui,sans-serif;fill:#bbb09c}.a{stroke:#c2a36b;stroke-width:3;fill:none;marker-end:url(#arr)}</style></defs>
 <rect class="bg" width="1120" height="500" rx="24"/><text class="h" x="42" y="48">PHÒNG THỦ LÀ NHIỀU CƠ CHẾ KHÁC NHAU · KHÔNG GỘP THÀNH “BLOCK”</text>
 <rect class="box" x="44" y="100" width="310" height="125" rx="16"/><text class="h" x="68" y="139">NÉ / DI CHUYỂN</text><text class="t" x="68" y="172">Dash/Sprint: đổi vị trí, lối thoát</text><text class="s" x="68" y="201">i-frame và loại đòn né được: chưa đo</text>
 <rect class="gold" x="405" y="100" width="310" height="125" rx="16"/><text class="h" x="429" y="139">GUARD / RIPOSTE</text><text class="t" x="429" y="172">Black Coat: block theo hướng</text><text class="s" x="429" y="201">Artemis Blades: Riposte theo Aspect</text>
 <rect class="red" x="766" y="100" width="310" height="125" rx="16"/><text class="h" x="790" y="139">ARMOR</text><text class="t" x="790" y="172">Patch 10: tạm trước bền hơn</text><text class="s" x="790" y="201">Thứ tự khác / phần dư: chưa xác minh</text>
 <path class="a" d="M200 236v54h720v-54"/><text class="s" x="382" y="279">Nhận diện loại đòn trước; một cơ chế không thay thế hai cơ chế còn lại.</text>
 <rect class="box" x="154" y="316" width="812" height="110" rx="16"/><text class="h" x="186" y="356">HỒ SƠ AN TOÀN CẦN ĐO TRONG RUN</text><text class="t" x="186" y="391">Attack type → hướng/telegraph → block/né được? → Life/Armor đổi bao nhiêu? → stagger/interrupt?</text>
 <text class="s" x="44" y="472">Early Access Patch 10 (07/2025) là mốc lịch sử; không chứng minh đúng trạng thái ISO RUNE/v1.0.</text>
</svg>
