<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
  <title id="title">Vòng quyết định chiến đấu Hades II</title>
  <desc id="desc">Đọc telegraph và vị trí địch, né hoặc tái định vị, chọn hành động, kiểm tra hiệu ứng/tài nguyên rồi chuẩn bị nhịp kế tiếp.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2a36b"/></marker><style>
    .bg{fill:#171820}.card{fill:#242631;stroke:#856e4d;stroke-width:2}.accent{fill:#3a2631;stroke:#d37869;stroke-width:2}.head{font:700 25px system-ui,sans-serif;fill:#f4e7c7}.txt{font:18px system-ui,sans-serif;fill:#ddd5c5}.small{font:15px system-ui,sans-serif;fill:#b7ad9b}.arrow{fill:none;stroke:#c2a36b;stroke-width:3;marker-end:url(#arrow)}
  </style></defs>
  <rect class="bg" x="0" y="0" width="1120" height="460" rx="24"/>
  <text class="head" x="44" y="50">MỘT NHỊP GIAO TRANH · SƠ ĐỒ HỌC CHƠI, KHÔNG PHẢI CALL GRAPH</text>
  <g>
    <rect class="card" x="44" y="104" width="230" height="128" rx="16"/><text class="head" x="66" y="145">1 · ĐỌC</text><text class="txt" x="66" y="178">Telegraph · hướng</text><text class="txt" x="66" y="205">địch · hazard · lối thoát</text>
    <rect class="card" x="318" y="104" width="230" height="128" rx="16"/><text class="head" x="340" y="145">2 · GIỮ AN TOÀN</text><text class="txt" x="340" y="178">Dash/Sprint · đổi góc</text><text class="txt" x="340" y="205">Guard chỉ khi có cơ chế</text>
    <rect class="accent" x="592" y="104" width="230" height="128" rx="16"/><text class="head" x="614" y="145">3 · CHỌN ĐÒN</text><text class="txt" x="614" y="178">Attack / Special / Cast</text><text class="txt" x="614" y="205">Ω / Hex nếu an toàn</text>
    <rect class="card" x="866" y="104" width="210" height="128" rx="16"/><text class="head" x="888" y="145">4 · KIỂM TRA</text><text class="txt" x="888" y="178">Hit · status · Armor</text><text class="txt" x="888" y="205">Magick · Hex charge</text>
    <path class="arrow" d="M276 168h35"/><path class="arrow" d="M550 168h35"/><path class="arrow" d="M824 168h35"/>
  </g>
  <rect class="card" x="318" y="300" width="504" height="104" rx="16"/><text class="head" x="344" y="340">5 · TÁI ĐỊNH VỊ / CHỌN NHỊP TIẾP</text><text class="txt" x="344" y="373">Dùng recovery của địch, hoặc rút khi đòn chưa an toàn.</text>
  <path class="arrow" d="M970 236 C970 340 858 352 828 352"/><path class="arrow" d="M318 352 C182 352 160 274 160 236"/>
  <text class="small" x="44" y="438">Không giả định né có i-frame; không có block chung cho mọi vũ khí; Ω/Hex và input cần kiểm tra theo bản.</text>
</svg>
