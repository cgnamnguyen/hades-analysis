<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" role="img" aria-labelledby="title desc">
 <title id="title">Luồng các màn hình/chặng người chơi đi qua trong một run</title><desc id="desc">Từ Crossroads và Training Grounds, chọn loadout, vào route, room gameplay với HUD, clear objective, mở reward/door, optional shop/event/gathering, Region Guardian, victory/defeat và quay Crossroads.</desc>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c5a064"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8d816d"/></marker><style>.bg{fill:#171820}.prep{fill:#30273a;stroke:#a88bc2;stroke-width:2}.game{fill:#243538;stroke:#78a9b0;stroke-width:2}.reward{fill:#3a3024;stroke:#c69b5a;stroke-width:2}.boss{fill:#402b37;stroke:#df8b77;stroke-width:2}.return{fill:#26372f;stroke:#83a78a;stroke-width:2}.h{font:700 20px system-ui,sans-serif;fill:#f4e7c7}.t{font:16px system-ui,sans-serif;fill:#ddd5c5}.s{font:14px system-ui,sans-serif;fill:#b9af9d}.a{fill:none;stroke:#c5a064;stroke-width:2.5;marker-end:url(#a)}.d{fill:none;stroke:#8d816d;stroke-width:2;stroke-dasharray:7 6}.fail{fill:none;stroke:#8d816d;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#b)}</style></defs>
 <rect class="bg" width="1300" height="700" rx="24"/><text class="h" x="42" y="44">SCREEN / CHẶNG FLOW · TÊN NHÓM MÀN, KHÔNG PHẢI UI SCREENSHOT</text>
 <rect class="prep" x="42" y="92" width="278" height="110" rx="16"/><text class="h" x="64" y="130">1 · CROSSROADS / HUB</text><text class="t" x="64" y="161">story · unlock · tài nguyên</text><text class="s" x="64" y="185">chưa vào run</text>
 <rect class="prep" x="378" y="92" width="278" height="110" rx="16"/><text class="h" x="400" y="130">2 · CHUẨN BỊ LOADOUT</text><text class="t" x="400" y="161">weapon · Arcana · support</text><text class="s" x="400" y="185">Training Grounds / Altar</text>
 <rect class="game" x="714" y="92" width="240" height="110" rx="16"/><text class="h" x="736" y="130">3 · VÀO ROUTE</text><text class="t" x="736" y="161">Underworld / Surface</text><text class="s" x="736" y="185">route reference</text>
 <rect class="game" x="1012" y="92" width="246" height="110" rx="16"/><text class="h" x="1034" y="130">4 · LOCATION</text><text class="t" x="1034" y="161">HUD · enemy · hazard</text><text class="s" x="1034" y="185">combat hoặc tương tác</text>
 <path class="a" d="M322 147h50"/><path class="a" d="M658 147h48"/><path class="a" d="M956 147h48"/>
 <rect class="reward" x="870" y="292" width="350" height="116" rx="16"/><text class="h" x="894" y="330">5 · CLEAR / RESOLVE</text><text class="t" x="894" y="361">wave/objective complete?</text><text class="s" x="894" y="386">claim resource; read next choices</text>
 <rect class="reward" x="434" y="292" width="350" height="116" rx="16"/><text class="h" x="458" y="330">6 · REWARD / DOOR</text><text class="t" x="458" y="361">Boon · Hammer · shop · event</text><text class="s" x="458" y="386">door pool/availability can vary</text>
 <path class="a" d="M1135 204v80"/><path class="a" d="M868 350h-80"/>
 <rect class="game" x="55" y="292" width="320" height="116" rx="16"/><text class="h" x="79" y="330">7 · LOCATION / ROOM KẾ</text><text class="t" x="79" y="361">build state carries through run</text><text class="s" x="79" y="386">repeat until Guardian gate</text>
 <path class="a" d="M432 350h-49"/><path class="d" d="M215 290V244H1134V204"/><text class="s" x="490" y="237">room loop</text>
 <rect class="boss" x="55" y="500" width="320" height="112" rx="16"/><text class="h" x="79" y="539">8 · GUARDIAN / ROUTE GATE</text><text class="t" x="79" y="570">boss / variant / phase</text><text class="s" x="79" y="594">kết quả phụ thuộc thắng / thua</text>
 <rect class="return" x="434" y="500" width="350" height="112" rx="16"/><text class="h" x="458" y="539">9 · GATE CLEARED</text><text class="t" x="458" y="570">còn Region → đi tiếp</text><text class="s" x="458" y="594">cuối route → run kết thúc</text>
 <rect class="prep" x="870" y="500" width="350" height="112" rx="16"/><text class="h" x="894" y="539">10 · CROSSROADS</text><text class="t" x="894" y="570">sau khi run kết thúc</text><text class="s" x="894" y="594">story · meta · chuyến mới</text>
 <path class="a" d="M215 408v84"/><path class="a" d="M378 556h48"/><path class="a" d="M786 556h78"/><text class="s" x="790" y="537">cuối route</text>
 <path class="fail" d="M215 613v31h830v-39"/><text class="s" x="516" y="638">Guardian hạ Melinoë → run kết thúc</text>
 <text class="s" x="42" y="682">Biểu diễn loại màn và transition gameplay; không khẳng định exact UI/menu name, từng animation, checkpoint hay save timing của ISO.</text>
</svg>
