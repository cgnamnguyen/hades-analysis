<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
 <title id="title">Bản đồ phân cấp phòng, Region, route và run</title><desc id="desc">Một run gồm các route; mỗi route có Region; mỗi Region có nhiều Location; một Location được xử lý và thưởng rồi chuyển sang Location kế; Guardian là gate giữa Region, kết thúc run quay về Crossroads.</desc>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c5a064"/></marker><style>.bg{fill:#171820}.run{fill:#402b37;stroke:#df8b77;stroke-width:2}.route{fill:#28263a;stroke:#a88bc2;stroke-width:2}.region{fill:#24363a;stroke:#78a9b0;stroke-width:2}.room{fill:#252833;stroke:#897650;stroke-width:2}.gate{fill:#3d2d2c;stroke:#d69b60;stroke-width:2}.h{font:700 21px system-ui,sans-serif;fill:#f4e7c7}.t{font:16px system-ui,sans-serif;fill:#ddd5c5}.s{font:14px system-ui,sans-serif;fill:#b9af9d}.a{fill:none;stroke:#c5a064;stroke-width:2.5;marker-end:url(#a)}.loop{fill:none;stroke:#9a8a6d;stroke-width:2;stroke-dasharray:7 6}</style></defs>
 <rect class="bg" width="1200" height="690" rx="24"/><text class="h" x="42" y="44">LEVEL MAP · ĐỪNG NHẦM ROOM VỚI REGION HAY TOÀN RUN</text>
 <rect class="run" x="42" y="86" width="1116" height="110" rx="18"/><text class="h" x="70" y="127">RUN / CHUYẾN CHƠI</text><text class="t" x="70" y="160">bắt đầu tại Crossroads → chọn một tuyến → qua nhiều Region → hoàn tất / thua → quay hub</text>
 <rect class="route" x="80" y="236" width="500" height="118" rx="17"/><text class="h" x="106" y="277">ROUTE A · UNDERWORLD</text><text class="t" x="106" y="312">Erebus → Oceanus → Fields → Tartarus</text><text class="s" x="106" y="338">bốn Region theo route reference</text>
 <rect class="route" x="620" y="236" width="500" height="118" rx="17"/><text class="h" x="646" y="277">ROUTE B · SURFACE</text><text class="t" x="646" y="312">Ephyra → Thessaly → Olympus → Summit</text><text class="s" x="646" y="338">bốn Region theo route reference</text>
 <path class="a" d="M390 198v31"/><path class="a" d="M810 198v31"/>
 <rect class="region" x="80" y="392" width="500" height="94" rx="16"/><text class="h" x="106" y="430">REGION</text><text class="t" x="106" y="460">nhiều Locations · encounter · event · reward branch</text>
 <rect class="gate" x="620" y="392" width="500" height="94" rx="16"/><text class="h" x="646" y="430">GUARDIAN GATE</text><text class="t" x="646" y="460">vượt qua → Region kế / route tiếp; biến thể Vow cần đọc riêng</text>
 <path class="a" d="M330 356v30"/><path class="a" d="M580 439h32"/>
 <rect class="room" x="80" y="530" width="500" height="105" rx="16"/><text class="h" x="106" y="569">LOCATION / ROOM CYCLE</text><text class="t" x="106" y="599">enter → combat/event/shop/gather → resolve → reward/door</text><text class="s" x="106" y="622">nhiều Location lặp trong Region; room count chưa biết</text>
 <rect class="run" x="620" y="530" width="500" height="105" rx="16"/><text class="h" x="646" y="569">KẾT QUẢ</text><text class="t" x="646" y="599">death / clear → Crossroads → story/meta → run mới</text><text class="s" x="646" y="622">persistence cụ thể tùy phần thưởng và chưa xác minh ISO</text>
 <path class="a" d="M330 488v34"/><path class="a" d="M580 582h32"/><path class="loop" d="M850 530v-28H580v-30"/>
 <text class="s" x="42" y="670">Khung cấp độ để đọc; tuyến tham khảo, không phải bản đồ địa hình hoặc sơ đồ save/state của ISO.</text>
</svg>
