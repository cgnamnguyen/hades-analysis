  <rect class="uw" x="35" y="198" width="250" height="128" rx="16"/><text class="label" x="160" y="235">1 · EREBUS</text><text class="txt" x="160" y="270">Guardian · Hecate</text><text class="small" x="160" y="300">Region / gate</text>
  <rect class="uw" x="335" y="198" width="250" height="128" rx="16"/><text class="label" x="460" y="235">2 · OCEANUS</text><text class="txt" x="460" y="270">Guardian · Scylla &amp; Sirens</text><text class="small" x="460" y="300">Region / gate</text>
