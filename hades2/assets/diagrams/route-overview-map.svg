  <rect class="uw" x="935" y="198" width="230" height="128" rx="16"/><text class="label" x="1050" y="235">4 · TARTARUS</text><text class="txt" x="1050" y="270">Final · Chronos</text><text class="small" x="1050" y="300">Route endpoint</text>
  <rect class="sf" x="35" y="420" width="250" height="128" rx="16"/><text class="label" x="160" y="457">1 · CITY OF EPHYRA</text><text class="txt" x="160" y="492">Guardian · Polyphemus</text><text class="small" x="160" y="522">Region / gate</text>
  <rect class="sf" x="335" y="420" width="250" height="128" rx="16"/><text class="label" x="460" y="457">2 · RIFT OF THESSALY</text><text class="txt" x="460" y="492">Guardian · Eris</text><text class="small" x="460" y="522">Region / gate</text>
