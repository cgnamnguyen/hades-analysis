<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
 <title id="title">Bản đồ tổng quan hai tuyến Hades II</title><desc id="desc">Từ Crossroads rẽ vào Underworld hoặc Surface. Mỗi tuyến có bốn Region và Guardian mốc theo thứ tự tham khảo; sơ đồ tuyến, không phải bản đồ phòng.</desc>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c5a064"/></marker><style>.bg{fill:#171820}.head{font:700 26px system-ui,sans-serif;fill:#f4e7c7}.label{font:700 18px system-ui,sans-serif;fill:#f4e7c7}.txt{font:16px system-ui,sans-serif;fill:#ddd5c5}.small{font:14px system-ui,sans-serif;fill:#b9af9d}.start{fill:#402b37;stroke:#df8b77;stroke-width:2}.uw{fill:#272639;stroke:#a98bc8;stroke-width:2}.sf{fill:#25363a;stroke:#78a9b0;stroke-width:2}.a{fill:none;stroke:#c5a064;stroke-width:3;marker-end:url(#a)}.d{fill:none;stroke:#99856b;stroke-width:2;stroke-dasharray:7 7}</style></defs>
 <rect class="bg" width="1200" height="650" rx="24"/><text class="head" x="40" y="48">HADES II · BẢN ĐỒ TỔNG QUAN HAI TUYẾN</text>
 <rect class="start" x="475" y="78" width="250" height="70" rx="16"/><text class="label" x="600" y="121" text-anchor="middle">CROSSROADS · chọn run</text>
