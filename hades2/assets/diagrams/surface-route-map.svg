<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
 <title id="title">Sơ đồ tuyến Surface Hades II</title><desc id="desc">City of Ephyra đến Polyphemus, Rift of Thessaly đến Eris, Mount Olympus đến Prometheus, The Summit đến Typhon.</desc>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c5a064"/></marker><style>.bg{fill:#171820}.box{fill:#233539;stroke:#78a9b0;stroke-width:2}.gate{fill:#3b2c34;stroke:#d98572;stroke-width:2}.h{font:700 25px system-ui,sans-serif;fill:#f4e7c7}.t{font:18px system-ui,sans-serif;fill:#e0d9cb}.s{font:15px system-ui,sans-serif;fill:#b9af9d}.a{fill:none;stroke:#c5a064;stroke-width:3;marker-end:url(#a)}.branch{fill:none;stroke:#72969b;stroke-width:2;stroke-dasharray:7 7}</style></defs>
 <rect class="bg" width="1200" height="510" rx="24"/><text class="h" x="40" y="50">SURFACE · REGION → GUARDIAN GATE</text>
 <g text-anchor="middle">
  <rect class="box" x="35" y="135" width="250" height="150" rx="18"/><text class="h" x="160" y="181">CITY OF EPHYRA</text><text class="t" x="160" y="222">Guardian · Polyphemus</text><text class="s" x="160" y="258">optional rooms/resources</text>
  <rect class="box" x="335" y="135" width="250" height="150" rx="18"/><text class="h" x="460" y="181">RIFT OF THESSALY</text><text class="t" x="460" y="222">Guardian · Eris</text><text class="s" x="460" y="258">ship/location encounters</text>
  <rect class="box" x="635" y="135" width="250" height="150" rx="18"/><text class="h" x="760" y="181">MOUNT OLYMPUS</text><text class="t" x="760" y="222">Guardian · Prometheus</text><text class="s" x="760" y="258">route pressure / encounters</text>
  <rect class="gate" x="935" y="135" width="230" height="150" rx="18"/><text class="h" x="1050" y="181">THE SUMMIT</text><text class="t" x="1050" y="222">Final Guardian · Typhon</text><text class="s" x="1050" y="258">route endpoint</text>
 </g>
 <path class="a" d="M287 210h40"/><path class="a" d="M587 210h40"/><path class="a" d="M887 210h40"/>
 <path class="branch" d="M160 287v78"/><rect class="box" x="45" y="365" width="260" height="70" rx="14"/><text class="t" x="175" y="396" text-anchor="middle">Side rooms / encounters</text><text class="s" x="175" y="420" text-anchor="middle">availability is conditional</text>
 <path class="branch" d="M460 287v78"/><rect class="box" x="330" y="365" width="260" height="70" rx="14"/><text class="t" x="460" y="396" text-anchor="middle">Shop / event / resource</text><text class="s" x="460" y="420" text-anchor="middle">not a guaranteed sequence</text>
 <text class="s" x="40" y="474">Schematic route only; not a floor plan. Surface unlock/survival rules and exact encounter pool need ISO/runtime confirmation.</text>
</svg>
